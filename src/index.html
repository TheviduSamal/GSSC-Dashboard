<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Team Leader Dashboard</title><style>
:root{--bg:#0b1020;--panel:#121a2d;--panel2:#19243a;--text:#edf3ff;--muted:#9baac4;--line:#293752;--accent:#70e1c1;--blue:#8caeff;--red:#ff8d9a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#182848 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,Segoe UI,sans-serif}
header{padding:24px clamp(16px,4vw,52px);border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center;flex-wrap:wrap}h1{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:-.04em}h1 span{color:var(--accent)}.sub{color:var(--muted);margin-top:4px}.wrap{max-width:1500px;margin:auto;padding:26px clamp(12px,3vw,36px)}.toolbar,.tabs,.stats,.grid{display:flex;gap:12px;flex-wrap:wrap}.tabs{margin:20px 0}.tab,button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;cursor:pointer;font-weight:600}.tab.active,button.primary{background:var(--accent);color:#09201b;border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}input,select{background:#0c1426;color:var(--text);border:1px solid var(--line);padding:11px 12px;border-radius:9px;min-width:130px}input:focus,select:focus{outline:2px solid var(--accent)}.panel,.stat{background:linear-gradient(140deg,var(--panel),#10182a);border:1px solid var(--line);border-radius:16px;padding:18px}.panel{margin-top:16px}.stat{flex:1;min-width:150px}.stat label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em}.stat strong{display:block;font-size:26px;margin-top:5px;overflow-wrap:anywhere}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:var(--muted)}.tablewrap{overflow:auto;margin-top:14px;max-height:80vh;border:1px solid var(--line);border-radius:10px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:13px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left}th{position:sticky;top:0;background:#202d46;color:#c9d8f1;z-index:1}tr:hover td{background:#18243a}.status{padding:7px 10px;border-radius:9px;background:#152a2a;color:var(--accent);font-size:13px}.status.err{background:#351b2a;color:var(--red)}.empty{text-align:center;padding:40px;color:var(--muted)}.small{font-size:12px}.hide{display:none}.formrow{display:flex;gap:10px;flex-wrap:wrap}.formrow input{flex:1}.right{margin-left:auto}.foot{padding:25px 0;color:var(--muted);font-size:12px}
.hrt th,.hrt td{text-align:center}.hrt td.k{text-align:left;font-weight:700;color:var(--accent)}.hrt .lo{background:#3a2f12;color:#ffd166;font-weight:700}.hrt .ok{background:#12351f;color:#4ade80;font-weight:700}.hrt .hi{background:#3f1620;color:#ff8d9a;font-weight:700}.hrt .wo{background:#14284a;color:var(--blue)}.hrt .nil{color:#ff8d9a66}.hrt th.s2{top:39px}
.ptsummary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(140deg,#121a2d,#0f172a)}
.ptcard{flex:1;min-width:150px;padding:10px 14px;border-radius:10px}
.ptcard .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.ptcard .val{font-size:22px;font-weight:700;margin-top:4px}
.ptcard.gssc{background:#14284a;border:1px solid #294aa0}.ptcard.gssc .val{color:#60a5fa}
.ptcard.gssk{background:#2a1a4a;border:1px solid #6a4aa0}.ptcard.gssk .val{color:#a78bfa}
.ptcard.comb{background:#3a2f12;border:1px solid #a0a040}.ptcard.comb .val{color:#facc15}
.ptcatlist{display:flex;gap:8px;flex-wrap:wrap}
.ptcatlist label{display:flex;align-items:center;gap:6px;cursor:pointer;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:13px}
.ptcatlist label:hover{border-color:var(--accent)}
.ptcatlist input[type=checkbox]{min-width:auto;cursor:pointer}
.pt-summary{display:inline-flex;flex-direction:column;border:1px solid rgba(6,182,212,0.2);border-radius:12px;overflow:hidden;background:rgba(17,24,39,0.5);margin:0 0 16px}
.pt-summary-head{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,0.08)}
.pt-summary-title{font-size:14px;font-weight:600;color:#67e8f9}
.pt-summary-body{display:flex;flex-wrap:wrap}
.pt-summary-cell{display:flex;align-items:center;gap:12px;padding:12px 16px;flex:1;min-width:150px;border-right:1px solid rgba(255,255,255,0.08)}
.pt-summary-cell:last-child{border-right:none}
.pt-summary-cell.comb{background:rgba(6,182,212,0.05)}
.pt-summary-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.pt-summary-lbl{font-size:10px;text-transform:uppercase;letter-spacing:0.05em;color:rgba(255,255,255,0.4);font-weight:500;margin-bottom:2px}
.pt-summary-val{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pt-summary-val.gssc{color:#60a5fa}
.pt-summary-val.gssk{color:#a78bfa}
.pt-summary-val.comb{color:#facc15}
.pt-summary-pct{font-size:10px;color:rgba(255,255,255,0.3);text-align:right}
.pt-summary-bar{width:56px;background:#374151;border-radius:9999px;height:4px;margin-top:4px;overflow:hidden}
.pt-summary-bar-fill{height:4px;border-radius:9999px}
.pt-summary-bar-fill.gssc{background:#3b82f6}
.pt-summary-bar-fill.gssk{background:#8b5cf6}
.pt-table{border-collapse:separate;border-spacing:0;font-size:0.88rem;min-width:100%}
.pt-table th{padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;text-align:center;background:#0a0d12;border-bottom:1px solid rgba(255,255,255,0.1);border-right:1px solid rgba(255,255,255,0.06);color:rgba(103,232,249,0.8);position:sticky;top:0;z-index:3}
.pt-table th.sticky-col{position:sticky;z-index:4}
.pt-table td{padding:2px 12px;line-height:1.25;text-align:center;border-bottom:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.03)}
.pt-table td.sticky-col{position:sticky;z-index:2}
.pt-table tbody tr:hover td:not(.sticky-col){background:rgba(255,255,255,0.03)!important}
.pt-hour-pill{display:inline-block;padding:2px 6px;border-radius:4px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.pt-hour-pill.gssc{background:rgba(59,130,246,0.18);color:#93c5fd}
.pt-hour-pill.gssk{background:rgba(139,92,246,0.18);color:#c4b5fd}
.pt-nil{color:rgba(255,255,255,0.15);font-size:13px;user-select:none}
.pt-gid-gssc{color:#60a5fa;font-weight:700;font-size:13px;letter-spacing:0.02em}
.pt-gid-gssk{color:#a78bfa;font-weight:700;font-size:13px;letter-spacing:0.02em}
.pt-total-gssc{color:#60a5fa;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pt-total-gssk{color:#a78bfa;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pt-primary-hit{color:#86efac;font-weight:600;font-size:13px}
.pt-primary-miss{color:rgba(255,255,255,0.4);font-size:13px}
.pt-footer-gssc{background:rgba(59,130,246,0.08)!important}
.pt-footer-gssk{background:rgba(139,92,246,0.08)!important}
.pt-footer-comb{background:rgba(6,182,212,0.08)!important}
.pt-footer-lbl{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.05em}
.pt-footer-gssc .pt-footer-lbl{color:#93c5fd}
.pt-footer-gssk .pt-footer-lbl{color:#c4b5fd}
.pt-footer-comb .pt-footer-lbl{color:#67e8f9}
.pt-footer-val{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.pt-footer-gssc .pt-footer-val{color:#60a5fa}
.pt-footer-gssk .pt-footer-val{color:#a78bfa}
.pt-footer-comb .pt-footer-val{color:#facc15}
.pt-footer-hour-gssc{color:#60a5fa;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.pt-footer-hour-gssk{color:#a78bfa;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
.pt-footer-hour-comb{color:#facc15;font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
/* ───── OUTFLOW (wow look) ───── */
.of-host{margin-top:14px}
.of-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.of-kpi{position:relative;overflow:hidden;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(145deg,#141f38,#0e1627)}
.of-kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--glow,#70e1c1);opacity:.14;filter:blur(8px)}
.of-kpi label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.of-kpi strong{display:block;font-size:30px;margin-top:6px;letter-spacing:-.03em;color:var(--glow,#70e1c1);font-variant-numeric:tabular-nums}
.of-kpi small{color:var(--muted)}
.of-split{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(145deg,#121a2d,#0f172a);margin-bottom:14px}
.of-splitbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:#1c2740;margin:10px 0}
.of-splitbar span{display:block;height:100%;transition:width .6s}
.of-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px}
.of-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.of-legend b{font-variant-numeric:tabular-nums}
.of-tools{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 8px;flex-wrap:wrap;gap:8px}
.of-proj{border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#121a2d,#0f172a);margin-bottom:8px;overflow:hidden;transition:border-color .2s,transform .2s}
.of-proj:hover{border-color:var(--accent)}
.of-proj[open]{border-color:#3b5380}
.of-proj summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:14px;padding:13px 16px}
.of-proj summary::-webkit-details-marker{display:none}
.of-proj summary::before{content:"▸";color:var(--muted);transition:transform .2s}
.of-proj[open] summary::before{transform:rotate(90deg);color:var(--accent)}
.of-rank{min-width:34px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.of-name{min-width:150px;max-width:240px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.of-trackwrap{flex:1;min-width:120px;height:10px;background:#1a2540;border-radius:99px;overflow:hidden}
.of-track{display:flex;height:100%;border-radius:99px;overflow:hidden;transition:width .6s}
.of-track span{display:block;height:100%}
.of-total{min-width:80px;text-align:right;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;color:var(--accent)}
.of-t{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--line)}
.of-t th{position:static;background:#0d1426;color:#8fa3c7;font-size:11px;text-transform:uppercase;letter-spacing:.08em;text-align:right}
.of-t th:first-child,.of-t td:first-child{text-align:left}
.of-t td{text-align:right;font-variant-numeric:tabular-nums;border-bottom:1px solid rgba(255,255,255,.05)}
.of-t td:first-child{color:#cfe0ff}
.of-t td.dim{color:rgba(255,255,255,.18)}
.of-t td.tot{font-weight:700;color:var(--accent)}
.of-share{display:inline-block;min-width:44px;padding:2px 8px;border-radius:99px;background:#16304a;color:#8cc8ff;font-size:12px}
/* region tabs + hourly full-screen */
.of-regions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.of-rtab{padding:8px 14px;border-radius:10px}
.of-rtab small{opacity:.7;margin-left:6px;font-weight:500}
.of-rtab.on{background:var(--accent);color:#09201b;border-color:var(--accent)}
.of-view{margin-left:auto;display:flex;gap:6px;align-items:center}
.of-view button{padding:7px 12px}
.of-view button.on{background:#3b5380;border-color:#5b7bb8}
body.hm .wrap{max-width:none;padding:14px 1vw}
body.hm .tablewrap{max-height:calc(100vh - 250px);min-height:420px}
body.hm .hrt{width:100%;font-size:clamp(12px,.82vw,17px)}
body.hm .hrt th{padding:clamp(7px,.8vh,14px) clamp(6px,.5vw,12px)}
body.hm .hrt td{padding:clamp(2px,.3vh,5px) clamp(6px,.5vw,12px);line-height:1.25}
body.hm .hrt thead tr:first-child th[colspan]{height:44px}
body.hm .hrt th.s2{top:44px}
.hrt .fz{position:sticky;background:#121a2d;z-index:2}
.hrt th.fz{background:#202d46;z-index:5}
.hrt tr:hover td.fz{background:#18243a}
.hrt .fzl{box-shadow:3px 0 6px -2px rgba(0,0,0,.6);border-right:1px solid #3b5380}
.hrt tr.idle td{color:#7d8aa3}
tr[data-gid]{cursor:pointer}
.gm-back{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.gm-box{width:100%;max-width:1100px;max-height:94vh;overflow:auto;border-radius:18px;border:1px solid #3b5380;background:linear-gradient(135deg,#0f172a,#111c34);box-shadow:0 10px 60px rgba(0,0,0,.6)}
.gm-box.big{max-width:96vw}
.gm-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.gm-av{width:44px;height:44px;border-radius:50%;border:2px solid #3b82f6;color:#60a5fa;display:flex;align-items:center;justify-content:center;font-weight:700}
.gm-btns{display:flex;gap:6px;align-items:center}
.gm-btns button{padding:6px 10px;font-size:13px}
.gm-body{padding:20px 22px;display:flex;flex-direction:column;gap:18px}
.gm-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.gm-kpi{padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid var(--line);border-left:4px solid var(--c)}
.gm-kpi label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.gm-kpi strong{font-size:24px;color:var(--c);font-variant-numeric:tabular-nums}
.gm-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03)}
.gm-card h4{margin:0;padding:12px 16px;font-size:13px;background:rgba(255,255,255,.04);display:flex;justify-content:space-between;align-items:center;gap:8px}
.gm-card table{font-size:12px}
.gm-card th{position:static;text-align:center;background:rgba(255,255,255,.04);color:#9baac4}
.gm-card td{text-align:center;font-variant-numeric:tabular-nums}
.gm-chip{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.gm-chip.e{background:rgba(59,130,246,.12);border:1px solid rgba(59,130,246,.35);color:#93c5fd}
.gm-chip.o{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5}
.gm-chart{display:flex;padding:16px 16px 6px}
.gm-yax{position:relative;width:44px;margin-right:6px}
.gm-yax span{position:absolute;right:4px;font-size:10px;color:#9baac4;transform:translateY(-50%)}
.gm-plot{position:relative;flex:1}
.gm-grid{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.08)}
.gm-cols{position:absolute;inset:0;display:flex}
.gm-col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-left:1px solid rgba(255,255,255,.05)}
.gm-bar{width:min(56px,70%);display:flex;flex-direction:column;justify-content:flex-end;position:relative}
.gm-bar i{display:block;width:100%;min-height:2px}
.gm-xl{display:flex;margin:0 16px 6px 56px}
.gm-xl span{flex:1;text-align:center;font-size:11px;color:#c9d8f1}
.gm-leg{display:flex;justify-content:center;gap:16px;font-size:12px;padding:6px 0 12px}
.gm-leg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.gm-card select{padding:4px 8px;min-width:0;font-size:12px}
@media(max-width:650px){header{align-items:flex-start}.toolbar>*{width:100%}.tab{flex:1}.stat strong{font-size:21px}.of-name{min-width:90px}.of-trackwrap{display:none}}
</style></head><body>
<header><div><h1>TL <span>Dashboard</span></h1><div class="sub"></div></div><div class="toolbar"><span id="status" class="status">Ready</span><button id="reload" class="primary">↻ Reload data</button><button id="authBtn" class="hide">API login</button></div></header>
<main class="wrap"><div class="stats" id="stats"></div>
<nav class="tabs" id="tabs"></nav>
<section class="panel"><div class="panelhead"><div><h2 id="heading" style="margin:0">Hourly Data</h2><div id="description" class="muted small">Saved Firebase records</div></div><div class="toolbar"><input id="search" placeholder="Search rows…" aria-label="Search rows"><button id="copyImg">🖼 Copy Image</button><button id="dlImg">⬇ Download Image</button><button id="dlExcel">📊 Export Excel</button><button id="csv" class="hide">Export CSV</button></div></div>
<div class="toolbar" style="margin-top:14px"><select id="leaderFilter"><option value="">All team leaders</option></select><input type="date" id="dateFilter" title="Date filter"></div>
<div class="toolbar hide" id="fetchBar" style="margin-top:12px"><button id="fetchLive" class="primary" title="Tries to fetch live data. If live is unavailable, falls back to saved Firebase data.">↻ Fetch</button><span id="fetchMeta" class="muted small" style="align-self:center"></span></div>
<div class="toolbar hide" id="ptBar" style="margin-top:12px"><input id="ptProject" list="ptProjects" placeholder="Project name" aria-label="Project name"><datalist id="ptProjects"></datalist><input id="ptTask" list="ptTasks" placeholder="Task name (comma-sep for multiple)" aria-label="Task name"><datalist id="ptTasks"></datalist><select id="ptCenter" aria-label="Center"><option value="both">Both Centers</option><option value="GSSC">GSSC</option><option value="GSSK">GSSK</option></select><button id="fetchData" class="primary">Fetch data</button></div>
<div class="toolbar hide" id="ptCatBar" style="margin-top:10px"><span class="muted small" style="align-self:center">Categories:</span><div id="ptCatList" class="ptcatlist"></div></div>
<div id="meta" class="muted small" style="margin-top:12px"></div><div id="table" class="tablewrap"><div class="empty">Loading…</div></div><div class="panelhead" style="margin-top:12px"><span id="count" class="muted small"></span></div></section>
<section class="panel hide" id="requestPanel"><div class="panelhead"><div><h2 style="margin:0">API Data Request</h2><div class="muted small">Select an API route, add optional query parameters/body, then press Send Request to inspect the actual server response.</div></div><span id="requestStatus" class="status">Ready</span></div>
<div class="formrow" style="margin-top:14px"><select id="requestEndpoint" aria-label="API endpoint"><option value="/api/health">GET /api/health — Health check</option><option value="/api/tl-hourly">GET /api/tl-hourly — TL hourly data</option><option value="/api/staff">GET /api/staff — Staff data</option><option value="/api/filtered">GET /api/filtered — Filtered data</option><option value="/api/outflow">GET /api/outflow — Outflow data</option><option value="/api/queue">GET /api/queue — Queue monitor data</option><option value="/api/cancellation">GET /api/cancellation — Cancellation data</option><option value="/api/staff-lookup">GET /api/staff-lookup — Staff lookup CSV</option><option value="/api/project-task-lookup">GET /api/project-task-lookup — Project/task lookup</option><option value="/api/fetch-all">GET /api/fetch-all — Live refresh (may be disabled)</option><option value="/api/fetch">GET /api/fetch — Live fetch (may be disabled)</option><option value="/api/fetch-filtered">GET /api/fetch-filtered — Live filtered refresh (may be disabled)</option><option value="/api/fetch-outflow">GET /api/fetch-outflow — Live outflow refresh</option><option value="/api/fetch-cancellation">GET /api/fetch-cancellation — Live cancellation refresh</option><option value="/api/queue-monitor">GET /api/queue-monitor — Queue refresh</option></select><select id="requestMethod" aria-label="HTTP method"><option>GET</option><option>POST</option><option>DELETE</option></select><input id="requestQuery" placeholder="Query string e.g. id=abc" aria-label="Query string"><button id="sendRequest" class="primary">Send request</button></div>
<label class="muted small" for="requestBody" style="display:block;margin-top:12px">JSON body (used for POST requests)</label><textarea id="requestBody" rows="3" style="width:100%;margin-top:6px;background:#0c1426;color:var(--text);border:1px solid var(--line);padding:11px;border-radius:9px;font:13px ui-monospace,monospace" placeholder='{"project_name":"Project A","task_name":"Task A","target":100}'></textarea>
<div class="panelhead" style="margin-top:16px"><strong>Response</strong><div class="toolbar"><button id="copyResponse">Copy JSON</button><button id="downloadResponse">Download JSON</button></div></div><div id="requestMeta" class="muted small" style="margin:8px 0">No request sent yet.</div><pre id="requestResponse" style="white-space:pre-wrap;overflow:auto;max-height:420px;background:#080e1b;border:1px solid var(--line);border-radius:10px;padding:14px;color:#cce5ff;font:12px/1.5 ui-monospace,monospace">Choose an endpoint and click “Send request”.</pre><div id="requestTable" class="tablewrap"></div></section>
</main>

const HIDDEN_COL_KEYS = new Set([
  'timestamp',
  'shifteventname',
  'taskuuid',

]);
const PROBE_NORM = new Set(['probeid','probe']);
const SCENE_NORM = new Set(['sceneid','scene']);
const normKey = k => String(k).toLowerCase().replace(/[^a-z0-9]/g,'');
function prepareRowForTable(r){
  if(!r || typeof r !== 'object') return r;
  let probeVal='', sceneVal='', probeSeen=false, sceneSeen=false;
  for(const k of Object.keys(r)){
    const kn = normKey(k);
    if(PROBE_NORM.has(kn)){ probeSeen=true; if(r[k]!=null && r[k]!=='') probeVal=String(r[k]); }
    if(SCENE_NORM.has(kn)){ sceneSeen=true; if(r[k]!=null && r[k]!=='') sceneVal=String(r[k]); }
  }
  const out = {};
  let mergedEmitted = false;
  const emitMerged = () => {
    if(mergedEmitted) return;
    mergedEmitted = true;
    const v = [probeVal, sceneVal].filter(Boolean).join(' / ');
    if(v) out['probe_scene_id'] = v;
  };
  for(const [k,v] of Object.entries(r)){
    const kn = normKey(k);
    if(HIDDEN_COL_KEYS.has(kn)) continue;
    if(PROBE_NORM.has(kn) || SCENE_NORM.has(kn)){
      emitMerged();
      continue;
    }
    out[k] = v;
  }
  if((probeSeen || sceneSeen) && !mergedEmitted) emitMerged();
  return out;
}

function parseCsv(t){const R=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){r.push(c.trim());c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;r.push(c.trim());c='';if(r.some(x=>x))R.push(r);r=[]}else c+=ch}r.push(c.trim());if(r.some(x=>x))R.push(r);return R}

function dedupe(a){const per={};a.forEach(r=>{const L=r.team_leader||'',k=[r.timestamp,nid(r.staff_id),r.project_name,r.task_name,r.value,r.denominator??'',r.wd??'',r.count??''].join('\u0001'),m=per[L]||(per[L]=new Map()),e=m.get(k);e?e.n++:m.set(k,{r,n:1})});const best=new Map();Object.values(per).forEach(m=>m.forEach((e,k)=>{const b=best.get(k);if(!b||e.n>b.n)best.set(k,e)}));const out=[];best.forEach(e=>{for(let i=0;i<e.n;i++)out.push(e.r)});return out}

function unwrapResponse(d){if(!d)return d;if(d.data!==undefined)return unwrapResponse(d.data);if(d.projects!==undefined)return unwrapResponse(d.projects);return d}
function extractProjectNames(d,set){
  if(!d)return;const root=unwrapResponse(d);if(!root)return;
  if(Array.isArray(root)){root.forEach(item=>{if(typeof item==='string'){const s=item.trim();if(s)set.add(s);return}if(item&&typeof item==='object'){const p=item.project||item.project_name||item.projectName||item.Project||item.name;if(typeof p==='string'&&p.trim())set.add(p.trim())}});return}
  if(typeof root==='object'){const direct=root.project||root.project_name||root.projectName;if(typeof direct==='string'&&direct.trim())set.add(direct.trim());Object.values(root).forEach(v=>{if(v==null)return;if(typeof v==='string')return;if(Array.isArray(v)){extractProjectNames(v,set);return}if(typeof v==='object'){const p=v.project||v.project_name||v.projectName||v.Project;if(typeof p==='string'&&p.trim())set.add(p.trim());else extractProjectNames(v,set)}})}
}
async function loadProjectsFromFirebaseREST(){
  const base=String(window.QAT_FIREBASE_DB_URL||'').replace(/\/+$/,'');
  if(!base)throw Error('QAT_FIREBASE_DB_URL not set');
  const url=base+'/Project%20And%20Region.json';
  const r=await fetch(url,{cache:'no-store'});
  if(!r.ok)throw Error('HTTP '+r.status);

  if(!data||typeof data!=='object')return [];
  const set=new Set();Object.values(data).forEach(v=>{const p=String(v&&v.project!=null?v.project:'').trim();if(p)set.add(p)});
  return [...set];
}

async function ptFetchLive(){
  const P=$('ptProject').value.trim(),T=$('ptTask').value.trim();
  const date=$('dateFilter').value||bizDate(),tok=++liveTok;
  const tasks=T.split(',').map(t=>t.trim()).filter(Boolean);
  setStatus('Fetching live…');
  $('table').innerHTML='<div class="empty">Fetching live'+(P?' for '+esc(P):'')+(tasks.length?' / '+esc(tasks.join(', ')):'')+'…<br><span class="small">The first request can take a while if the server is waking up.</span></div>';
  try{
    const allRows=[];let fails=0;
    if(tasks.length===0){
      const qs=new URLSearchParams({project_name:P,project:P,date});
      const d=await api('/api/fetch-filtered?'+qs);
      if(tok!==liveTok)return;
      allRows.push(...flatten(d.data!==undefined?d.data:d));
    }else{
      for(const task of tasks){
        try{const qs=new URLSearchParams({project_name:P,project:P,task_name:task,task,date});const d=await api('/api/fetch-filtered?'+qs);if(tok!==liveTok)return;allRows.push(...flatten(d.data!==undefined?d.data:d))}catch(e){fails++}
      }
    }
    const enriched=allRows.map(r=>({...r,category:getRowCategory(r.project_name,r.task_name,r.template_name)}));
    ptLive=enriched;
    liveInfo=` · ${P||'(all)'} / ${tasks.join(', ')||'(all)'} · ${date} · ${allRows.length.toLocaleString()} rows fetched`+(fails?` · ${fails} task(s) failed`:'');
    updatePTCategories();render();setStatus('Live');
  }catch(e){
    if(tok!==liveTok)return;
    ptLive=null;liveInfo='';updatePTCategories();render();
    $('table').innerHTML=`<div class="empty">${esc(e.message)}<br><br>Live fetch failed.</div>`;
    setStatus('Live fetch failed',true);
  }
}

}

}

function parseTs(ts){const s=String(ts??'').trim();if(!s)return null;const n=Number(s);if(!isNaN(n)&&n>0){if(n>1e12)return new Date(n);if(n>1e9)return new Date(n*1000)}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.\d+)?\s*(AM|PM)?$/i);if(m){let h=+m[4];const ap=m[7]&&m[7].toUpperCase();if(ap=='PM'&&h<12)h+=12;if(ap=='AM'&&h==12)h=0;return new Date(+m[1],m[2]-1,+m[3],h,+m[5],+(m[6]||0))}const d=new Date(s);return isNaN(d)?null:d}
function slotOf(ts){const d=parseTs(ts);if(!d)return -1;const m=d.getHours()*60+d.getMinutes();return Math.floor((((m-ANCHOR)%1440)+1440)%1440/60)}

const OF_NUM_KEYS=['outflow','total_outflow','total','value','count','scenes','scene_count','qty','quantity','amount'];
const OF_FIXED={GSSC:'#60a5fa',GSSK:'#a78bfa'};
const OF_EXTRA=['#34d399','#fbbf24','#f472b6','#22d3ee','#fb923c'];

function ofNorm(r){
  const g=(...ks)=>{for(const k of ks){if(r[k]!==undefined&&r[k]!==null&&String(r[k]).trim()!=='')return r[k]}return ''};
  const project=String(g('project_name','project','Project')).trim()||'(no project)';
  const task=String(g('task_name','task','Task')).trim()||'(no task)';
  const center=String(g('center','center_name','centre','Center')).trim().toUpperCase()||'OTHER';
  let val=null;
  for(const k of OF_NUM_KEYS){if(r[k]!==undefined&&r[k]!==''&&r[k]!==null&&!isNaN(num(r[k]))){val=num(r[k]);break}}
  const pr=getProjectRegion(project);
  const region=pr!=='Unknown'?pr:(String(g('region','Region')).trim().toUpperCase()||'Unknown');
  /* FIX: supervisor comes first from Firebase "Project And Region" -> responsible_team_supervisor */
  let sup=getProjectSupervisor(project);
  if(!sup){
    for(const k of Object.keys(r)){if(/supervisor/i.test(k)&&String(r[k]??'').trim()){sup=String(r[k]).trim();break}}
  }
  if(!sup){const sid=g('staff_id','qat_id','gid');const info=sid?staff[nid(sid)]:null;if(info&&info.tl)sup=info.tl}
  /* split combined supervisors like "Thevidu / Bimal" into individual names */
  const sups=[...new Set(String(sup||'').split(/\s*(?:\/|,|&|;|\+|\band\b)\s*/i).map(s=>s.trim()).filter(Boolean))];
  return{project,task,center,region,sup:sup||'Unassigned',sups:sups.length?sups:['Unassigned'],val:val===null?1:val};
}

  const allTotal=all.reduce((n,x)=>n+x.val,0);
  const unk=[...new Set(all.filter(x=>x.region==='Unknown').map(x=>x.project))];
  const note=unk.length&&ofRegion!=='ALL'&&ofRegion!=='Unknown'?'':(unk.length?`<div class="muted small" style="margin-bottom:12px">⚠ ${unk.length} project(s) have no region · Region map: ${esc(regionStatus)} · e.g. ${esc(unk.slice(0,6).join(', '))}</div>`:'');
  const regBar=note+`<div class="of-regions"><button class="tab of-rtab ${ofRegion==='ALL'?'on':''}" data-reg="ALL">All regions<small>${ofFmt(allTotal)}</small></button>${regions.map(r=>`<button class="tab of-rtab ${ofRegion===r?'on':''}" data-reg="${esc(r)}">${esc(r)}<small>${ofFmt(R[r].total)}</small></button>`).join('')}<span class="of-view"><span class="muted small">View:</span><button data-view="project" class="${view==='project'?'on':''}">By Project</button><button data-view="task" class="${view==='task'?'on':''}">By Task</button>${isEmea?`<button data-view="sup" class="${view==='sup'?'on':''}">By Shift Supervisor</button>`:''}</span></div>`;
  const regData=ofRegion==='ALL'?all:all.filter(x=>x.region===ofRegion);
  const taskList=[...new Set(regData.map(x=>x.task))].sort((a,b)=>a.localeCompare(b));
  if(ofTask!=='ALL'&&!taskList.includes(ofTask))ofTask='ALL';
  const data=regData.filter(x=>view!=='sup'||ofTask==='ALL'||x.task===ofTask).flatMap(x=>view==='sup'?x.sups.map((s,i)=>({...x,g1:s,g2:x.project+' / '+x.task,dup:i>0})):view==='task'?[{...x,g1:x.task,g2:x.project,dup:false}]:[{...x,g1:x.project,g2:x.task,dup:false}]);
  const taskBar=view==='sup'?`<div class="of-regions"><span class="muted small">Task:</span><select id="ofTask"><option value="ALL">All tasks</option>${taskList.map(t=>`<option value="${esc(t)}" ${t===ofTask?'selected':''}>${esc(t)}</option>`).join('')}</select>${ofTask!=='ALL'?`<button id="ofTaskClear" style="padding:7px 12px">✕ Clear task</button>`:''}</div>`:'';
  const P=new Map(),C={};let total=0;
  data.forEach(x=>{
    /* a project shared by several supervisors appears under each, but is counted once in the overall totals */
    if(!x.dup){total+=x.val;C[x.center]=(C[x.center]||0)+x.val}
    let p=P.get(x.g1);if(!p){p={name:x.g1,total:0,c:{},t:new Map()};P.set(x.g1,p)}
    p.total+=x.val;p.c[x.center]=(p.c[x.center]||0)+x.val;
    let t=p.t.get(x.g2);if(!t){t={name:x.g2,total:0,c:{}};p.t.set(x.g2,t)}
    t.total+=x.val;t.c[x.center]=(t.c[x.center]||0)+x.val;
  });
  const centers=Object.keys(C).sort((a,b)=>C[b]-C[a]);
  const col=c=>ofColor(c,centers.indexOf(c));
  const projs=[...P.values()].sort((a,b)=>b.total-a.total);
  const max=projs[0].total||1;
  const pct=(a,b)=>b>0?(a/b*100).toFixed(1):'0.0';
  const grpLabel=view==='sup'?'Shift supervisors':view==='task'?'Tasks':'Projects',subLabel=view==='sup'?'Project / Task':view==='task'?'Project':'Task';

  const split=`<div class="of-split"><label class="muted small" style="text-transform:uppercase;letter-spacing:.1em">Center split · ${esc(ofRegion==='ALL'?'All regions':ofRegion)}</label>
    <div class="of-splitbar">${centers.map(c=>`<span title="${esc(c)} ${ofFmt(C[c])}" style="width:${pct(C[c],total)}%;background:${col(c)}"></span>`).join('')}</div>
    <div class="of-legend">${centers.map(c=>`<div><i style="background:${col(c)}"></i>${esc(c)} <b>${ofFmt(C[c])}</b> <span class="muted">(${pct(C[c],total)}%)</span></div>`).join('')}<div class="muted">Total <b style="color:var(--text)">${ofFmt(total)}</b></div></div></div>`;

  const list=projs.map((p,i)=>{
    const tasks=[...p.t.values()].sort((a,b)=>b.total-a.total);
    const track=centers.filter(c=>p.c[c]).map(c=>`<span style="width:${pct(p.c[c],p.total)}%;background:${col(c)}"></span>`).join('');
    const head=`<tr><th>${subLabel}</th>${centers.map(c=>`<th style="color:${col(c)}">${esc(c)}</th>`).join('')}<th>Total</th><th>Share</th></tr>`;
    const body=tasks.map(t=>`<tr><td>${esc(t.name)}</td>${centers.map(c=>t.c[c]?`<td>${ofFmt(t.c[c])}</td>`:'<td class="dim">—</td>').join('')}<td class="tot">${ofFmt(t.total)}</td><td><span class="of-share">${pct(t.total,p.total)}%</span></td></tr>`).join('');
    return `<details class="of-proj"><summary><span class="of-rank">#${i+1}</span><span class="of-name" title="${esc(p.name)}">${esc(p.name)}</span><div class="of-trackwrap"><div class="of-track" style="width:${pct(p.total,max)}%">${track}</div></div><span class="of-total">${ofFmt(p.total)}</span></summary><div style="overflow-x:auto"><table class="of-t"><thead>${head}</thead><tbody>${body}</tbody></table></div></details>`;
  }).join('');

  $('table').innerHTML=regBar+taskBar+split+
    `<div class="of-tools"><strong>${grpLabel} by outflow</strong><span><button id="ofOpen" style="padding:6px 10px">Expand all</button> <button id="ofClose" style="padding:6px 10px">Collapse all</button></span></div>`+list;
  $('table').querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{ofRegion=b.dataset.reg;renderOutflow()});
  $('table').querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{ofView=b.dataset.view;renderOutflow()});
  if($('ofTask'))$('ofTask').onchange=e=>{ofTask=e.target.value;renderOutflow()};
  if($('ofTaskClear'))$('ofTaskClear').onclick=()=>{ofTask='ALL';renderOutflow()};
  $('ofOpen').onclick=()=>$('table').querySelectorAll('details').forEach(d=>d.open=true);
  $('ofClose').onclick=()=>$('table').querySelectorAll('details').forEach(d=>d.open=false);
  $('count').textContent=`${projs.length.toLocaleString()} ${grpLabel.toLowerCase()} · ${data.length.toLocaleString()} rows`;
}

async function loadLive(){
  if(staffReady)await staffReady;
  syncHourlyLeaders();
  const tl=$('leaderFilter').value,tok=++liveTok;
  const date=$('dateFilter').value||bizDate(),q=encodeURIComponent;
  setStatus('Fetching live…');
  $('table').innerHTML='<div class="empty">Fetching live data'+(tl?' for '+esc(tl):' for all team leaders')+'…<br><span class="small">The first request can take a while if the server is waking up.</span></div>';
  try{
    let url='/api/fetch-all?date='+q(date);
    if(tl)url+='&team_leader='+q(tl);
    const d=await api(url);
    if(tok!==liveTok)return;
    let list=Array.isArray(d.data)?d.data:(d.data&&typeof d.data==='object'?Object.values(d.data):[]);
    let fails=0;
    if(!list.length&&!tl&&tlList.length){
      list=[];
      for(const name of tlList){
        try{const r=await api('/api/fetch-all?team_leader='+q(name)+'&date='+q(date));list.push(...(Array.isArray(r.data)?r.data:(r.data&&typeof r.data==='object'?Object.values(r.data):[])))}catch{fails++}
        if(tok!==liveTok)return;
      }
    }
    const out=[];
    for(const t of list){let rs=t.rows,name=t.tl_name||tl;if(t.error){try{rs=(await api('/api/fetch?tl_name='+q(name)+'&date='+q(date))).rows||[]}catch{fails++;rs=[]}}(rs||[]).forEach(r=>out.push({...r,team_leader:name||r.team_leader||''}))}
    if(tok!==liveTok)return;
    rows=out;rowsD=dedupe(out);raw=d;
    liveInfo=` · ${tl||'All team leaders'} · ${date} · ${out.length.toLocaleString()} rows fetched`+(fails?` · ${fails} leader(s) failed`:'')+` · updated ${(d.updated_at||'').toString().slice(0,19).replace('T',' ')||'now'}`;
    render();setStatus('Live');
  }catch(e){
    if(tok!==liveTok)return;
    rows=[];rowsD=[];raw=null;liveInfo='';render();
    $('table').innerHTML=`<div class="empty">${esc(e.message)}<br><br>Try Again.</div>`;
    setStatus('Live fetch failed',true);
  }
}

function isNAValue(v){const s=String(v??'').trim().toLowerCase().replace(/[^a-z0-9]/g,'');return s==='na'}

function friendlyFetchError(msg){
  const m = String(msg||'');
  if(/501|not enabled|not implemented/i.test(m)) return 'Live refresh not enabled on this server';
  if(/404|not found/i.test(m)) return 'Live refresh endpoint not found';
  if(/network|failed to fetch|cors/i.test(m)) return 'Live server unreachable (CORS/network)';
  if(m.length > 70) return m.slice(0,70) + '…';
  return m;
}

async function fetchLiveData(){
  if(!active.fetchUrl) return;
  const btn=$('fetchLive');
  btn.disabled=true;
  const date=$('dateFilter').value||bizDate();
  setStatus('Fetching…');
  $('fetchMeta').textContent='Fetching '+active.label+' for '+date+'…';
  $('table').innerHTML='<div class="empty">Fetching '+esc(active.label)+' for '+esc(date)+'…<br><span class="small">If live fetch is unavailable on this server, saved Firebase data will be loaded instead.</span></div>';

  let liveError = null;
  try{
    const qs=new URLSearchParams({date});
    const d = await api(active.fetchUrl+'?'+qs);
    if(d && d.error) throw Error(d.error);
    let fetched = flatten(d.data!==undefined?d.data:d);
    if(active.id==='outflow'){
      fetched = fetched.filter(r=>!isNAValue(r.task_name??r.task)&&!isNAValue(r.center??r.center_name??r.centre));
    }
    rows = fetched;
    raw = d;
    render();
    const srcLabel = d.source==='firebase' ? 'saved data' : 'Grafana';
    setStatus(d.source==='firebase' ? 'Refreshed' : 'Live');
    $('fetchMeta').textContent='✓ '+rows.length.toLocaleString()+' rows from '+srcLabel+' · '+new Date().toLocaleTimeString();
    btn.disabled=false;
    return;
  }catch(e){
    liveError = e;
    console.warn('Live fetch failed, falling back to saved data:', e.message);
  }

  $('fetchMeta').textContent='⚠ '+friendlyFetchError(liveError.message)+' — loading saved data…';
  $('table').innerHTML='<div class="empty">⚠ '+esc(friendlyFetchError(liveError.message))+'<br><br>Loading saved Firebase data instead…</div>';

  try{
    raw = await api(active.url);
    let fetched = flatten(raw.data);
    if(active.id==='outflow'){
      fetched = fetched.filter(r=>!isNAValue(r.task_name??r.task)&&!isNAValue(r.center??r.center_name??r.centre));
    }
    rows = fetched;
    render();
    setStatus('Saved data');
    $('fetchMeta').textContent='ℹ '+friendlyFetchError(liveError.message)+' — showing '+rows.length.toLocaleString()+' saved rows';
  }catch(e2){
    console.error('Saved data load also failed:', e2);
    $('table').innerHTML='<div class="empty">'+esc(e2.message)+'<br><br>Live fetch and saved data load both failed.</div>';
    setStatus('Load failed', true);
    $('fetchMeta').textContent='✗ '+e2.message;
  }finally{
    btn.disabled=false;
  }
}

}

async function captureTableImage(title){
  const src=$('table');
  if(!src||!src.querySelector('table'))throw Error('No table to capture');
  if(typeof html2canvas==='undefined')throw Error('Image library not loaded yet');
  const clone=src.cloneNode(true);
  clone.id='';
  Object.assign(clone.style,{position:'absolute',left:'-99999px',top:'0',maxHeight:'none',maxWidth:'none',overflow:'visible',border:'none',borderRadius:'0',background:'#0b1020',padding:'20px',color:'#edf3ff',width:'auto'});
  clone.querySelectorAll('th').forEach(th=>{th.style.position='static';th.style.top='auto';th.style.zIndex='auto'});
  clone.querySelectorAll('td').forEach(td=>{if(td.style.position==='sticky'){td.style.position='static'}});
  if(title){const h=document.createElement('div');h.style.cssText='padding:14px 18px;font:700 16px/1.4 Inter,sans-serif;color:#70e1c1;background:#121a2d;border:1px solid #293752;border-radius:10px;margin-bottom:14px';h.textContent=title;clone.insertBefore(h,clone.firstChild)}
  document.body.appendChild(clone);
  const w=Math.max(clone.scrollWidth,clone.offsetWidth);
  clone.style.width=w+'px';
  try{return await html2canvas(clone,{backgroundColor:'#0b1020',scale:2,logging:false,useCORS:true,width:w})}
  finally{document.body.removeChild(clone)}
}

async function copyCanvas(canvas,text){
  try{
    const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));
    if(!blob)return false;
    const items={'image/png':blob};
    if(text)items['text/plain']=new Blob([text],{type:'text/plain'});
    await navigator.clipboard.write([new ClipboardItem(items)]);
    return true;
  }catch(e){console.warn('Copy failed:',e);return false}
}
function downloadCanvas(canvas,filename){
  canvas.toBlob(blob=>{
    if(!blob)return;
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  },'image/png');
}

async function doImageAction(mode){
  const btn=mode==='copy'?$('copyImg'):$('dlImg');
  btn.disabled=true;setStatus(mode==='copy'?'Copying image…':'Downloading image…');
  try{
    const title=exportTitle(),canvas=await captureTableImage(title),filename=exportBasename()+'.png';
    if(mode==='copy'){
      const ok=await copyCanvas(canvas,title);
      if(ok)setStatus('✅ Image copied');
      else{downloadCanvas(canvas,filename);setStatus('⚠ Copy not supported — downloaded instead')}
    }else{downloadCanvas(canvas,filename);setStatus('✅ Image downloaded')}
    setTimeout(()=>setStatus('Ready'),2500);
  }catch(e){console.error(e);setStatus('Export failed: '+e.message,true)}
  finally{btn.disabled=false}
}

function xlBanner(sh,numCols,title,subtitle){
  for(let c=0;c<numCols;c++){
    xlPut(sh,0,c,c===0?title:'',{font:xlFont(XLC.white,true,18),fill:xlFill(XLC.navy),alignment:{horizontal:'left',vertical:'center',indent:1}});
    xlPut(sh,1,c,c===0?subtitle:'',{font:xlFont('CBD5E1',false,10),fill:xlFill(XLC.slate),alignment:{horizontal:'left',vertical:'center',indent:1}});
    xlPut(sh,2,c,'',{fill:xlFill(XLC.accent)});
  }
  for(let r=0;r<3;r++)sh.merges.push({s:{r,c:0},e:{r,c:numCols-1}});
  sh.heights[0]=38;sh.heights[1]=22;sh.heights[2]=5;sh.heights[3]=10;
}
function xlFinalize(sh,widths,freezeCols,freezeRows){
  const lastRow=sh.maxRow,numCols=widths.length;
  sh.ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:lastRow,c:numCols-1}});
  sh.ws['!cols']=widths.map(w=>({wch:w}));
  const rows=[];Object.entries(sh.heights).forEach(([r,h])=>{rows[Number(r)]={hpt:h}});
  sh.ws['!rows']=rows;
  if(sh.merges.length>0)sh.ws['!merges']=sh.merges;
  sh.ws['!views']=[{showGridLines:false}];
  sh.ws['!xFreeze']=freezeCols||0;
  sh.ws['!yFreeze']=freezeRows||0;
  return sh.ws;
}
const xlHeaderStyle=(bg,color,sz)=>({font:xlFont(color||XLC.white,true,sz||11),fill:xlFill(bg),alignment:XL_CENTER,border:xlBorder(XLC.white)});
const xlBodyStyle=(fill,color,bold,edge)=>{const border=xlBorder(XLC.border);if(edge)border.left={style:'medium',color:{rgb:XLC.borderDark}};return{font:xlFont(color||XLC.text,bold||false,11),fill:xlFill(fill),alignment:XL_CENTER,border}};

function parseTsForExcel(ts){const s=String(ts??'').trim();if(!s)return null;const n=Number(s);if(!isNaN(n)&&n>0){if(n>1e12)return new Date(n);if(n>1e9)return new Date(n*1000)}const m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})(?::(\d{2}))?(?:\.(\d+))?\s*(AM|PM)?$/i);if(m){let h=+m[4];const ap=m[8]&&m[8].toUpperCase();if(ap==='PM'&&h<12)h+=12;if(ap==='AM'&&h===12)h=0;const ms=m[7]?+((m[7]+'00').slice(0,3)):0;return new Date(+m[1],+m[2]-1,+m[3],h,+m[5],+(m[6]||0),ms)}const d=new Date(s);return isNaN(d)?null:d}

async function exportWorkbookWithFreeze(wb,filename){
  const out=XLSX.write(wb,{bookType:'xlsx',type:'array',cellStyles:true});
  const zip=await JSZip.loadAsync(out);
  for(let i=0;i<wb.SheetNames.length;i++){
    const path=`xl/worksheets/sheet${i+1}.xml`;
    const file=zip.file(path);
    if(!file)continue;
    const ws=wb.Sheets[wb.SheetNames[i]];
    const xSplit=ws['!xFreeze']||0;
    const ySplit=ws['!yFreeze']||0;
    let views;
    if(xSplit>0&&ySplit>0){
      const topLeft=XLSX.utils.encode_cell({r:ySplit,c:xSplit});
      views=`<sheetViews><sheetView showGridLines="0" workbookViewId="0">`+
        `<pane xSplit="${xSplit}" ySplit="${ySplit}" topLeftCell="${topLeft}" activePane="bottomRight" state="frozen"/>`+
        `<selection pane="bottomRight" activeCell="${topLeft}" sqref="${topLeft}"/>`+
        `</sheetView></sheetViews>`;
    } else if(ySplit>0){
      const topLeft=XLSX.utils.encode_cell({r:ySplit,c:0});
      views=`<sheetViews><sheetView showGridLines="0" workbookViewId="0">`+
        `<pane ySplit="${ySplit}" topLeftCell="${topLeft}" activePane="bottomLeft" state="frozen"/>`+
        `<selection pane="bottomLeft" activeCell="${topLeft}" sqref="${topLeft}"/>`+
        `</sheetView></sheetViews>`;
    } else if(xSplit>0){
      const topLeft=XLSX.utils.encode_cell({r:0,c:xSplit});
      views=`<sheetViews><sheetView showGridLines="0" workbookViewId="0">`+
        `<pane xSplit="${xSplit}" topLeftCell="${topLeft}" activePane="topRight" state="frozen"/>`+
        `<selection pane="topRight" activeCell="${topLeft}" sqref="${topLeft}"/>`+
        `</sheetView></sheetViews>`;
    } else {
      views=`<sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>`;
    }
    let xml=await file.async('string');
    if(/<sheetViews>[\s\S]*?<\/sheetViews>/.test(xml)){
      xml=xml.replace(/<sheetViews>[\s\S]*?<\/sheetViews>/,views);
    }else if(/<sheetViews\s*\/>/.test(xml)){
      xml=xml.replace(/<sheetViews\s*\/>/,views);
    }else if(/<dimension[^>]*\/>/.test(xml)){
      xml=xml.replace(/(<dimension[^>]*\/>)/,'$1'+views);
    }else if(/<sheetFormatPr/.test(xml)){
      xml=xml.replace(/(<sheetFormatPr)/,views+'$1');
    }else{
      xml=xml.replace(/(<sheetData)/,views+'$1');
    }
    zip.file(path,xml);
  }
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function buildAllDataSheet(allRows,title,subtitle){
  if(!allRows||!allRows.length)return null;
  const sh=createXlSheet();
  const cols=[
    {key:'timestamp',kind:'date',label:'DATE'},
    {key:'timestamp',kind:'time',label:'TIME'},
    {key:'region',kind:'data',label:'REGION'},
    {key:'staff_id',kind:'data',label:'STAFF ID'},
    {key:'project_name',kind:'data',label:'PROJECT NAME'},
    {key:'task_name',kind:'data',label:'TASK NAME'},
    {key:'value',kind:'data',label:'VALUE'},
    {key:'denominator',kind:'data',label:'DENOMINATOR'},
    {key:'wd',kind:'data',label:'WD'},
    {key:'count',kind:'data',label:'COUNT'}
  ];
  const numCols=cols.length;
  xlBanner(sh,numCols,title,subtitle);
  cols.forEach((col,c)=>xlPut(sh,XL_HEADER_START,c,col.label,xlHeaderStyle(FIREBASE_HEADER_COLORS[c%FIREBASE_HEADER_COLORS.length],XLC.white,12)));
  sh.heights[XL_HEADER_START]=30;
  allRows.forEach((row,i)=>{
    const r=XL_HEADER_START+1+i;
    const fill=i%2===0?XLC.white:XLC.zebra;
    cols.forEach((col,c)=>{
      const k=col.key;
      const v=row[k];
      if(v===undefined||v===null){xlPut(sh,r,c,'',xlBodyStyle(fill));return}
      if(col.kind==='date'){
        const d=parseTsForExcel(String(v));
        if(!d){xlPut(sh,r,c,String(v),xlBodyStyle(fill,XLC.text,true));return}
        const serial=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000+25569;
        xlPut(sh,r,c,serial,xlBodyStyle(fill,XLC.text,true),'yyyy-mm-dd');
        return;
      }
      if(col.kind==='time'){
        const d=parseTsForExcel(String(v));
        if(!d){xlPut(sh,r,c,'',xlBodyStyle(fill));return}
        const serial=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400;
        xlPut(sh,r,c,serial,xlBodyStyle(fill,XLC.text,true),'hh:mm:ss AM/PM');
        return;
      }
      if(typeof v==='number'){
        xlPut(sh,r,c,v,xlBodyStyle(fill,k==='value'||k==='wd'?XLC.blue:XLC.text,k==='value'||k==='wd'),k==='wd'?'0.00':undefined);
        return;
      }
      if(typeof v==='object'){xlPut(sh,r,c,JSON.stringify(v),xlBodyStyle(fill,XLC.soft));return}
      const isId=k==='staff_id'||k==='region';
      xlPut(sh,r,c,String(v),xlBodyStyle(fill,isId?XLC.cyanText:XLC.soft,isId));
    });
    sh.heights[r]=20;
  });
  const widths=cols.map(col=>{
    if(col.kind==='date'||col.kind==='time')return 16;
    let max=col.label.length;
    allRows.forEach(r=>{
      const v=r[col.key];
      const len=v===undefined||v===null?0:String(v).length;
      if(len>max)max=len;
    });
    return Math.min(Math.max(14,max+4),40);
  });
  const ws=xlFinalize(sh,widths,0,XL_HEADER_START+1);
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:XL_HEADER_START,c:0},e:{r:XL_HEADER_START+allRows.length,c:numCols-1}})};
  return ws;
}

    xlPut(sh,r,c++,cap(s.staff_id),xlBodyStyle(fill,XLC.cyanText,true));
    xlPut(sh,r,c++,s.name,xlBodyStyle(fill,XLC.text,true));
    xlPut(sh,r,c++,s.primary,xlBodyStyle(fill,XLC.soft));
    xlPut(sh,r,c++,s.tl,xlBodyStyle(fill,XLC.soft));
    xlPut(sh,r,c++,s.dailyTarget,xlBodyStyle(fill,XLC.text,true),'0');
    xlPut(sh,r,c++,se,xlBodyStyle(fill,se<0?XLC.red:XLC.text,true),'0.00');

    sh.heights[r]=21;

  return xlFinalize(sh,widths,GENERAL_FREEZE_COLS,XL_HEADER_START+1);
}

function buildHourlySheet(staffEntries,slotData,showAdminCols,subtitle){
  const sh=createXlSheet();
  const baseHeaders=[{label:'GID',bg:'0284C7'},{label:'Name',bg:'7C3AED'},{label:'Primary',bg:'D97706'},{label:'Team Leader',bg:'059669'}];
  if(showAdminCols){baseHeaders.push({label:'Target',bg:'EA580C'},{label:'S/E',bg:'BE185D'},{label:'Status',bg:'4F46E5'})}
  baseHeaders.push({label:'Total WD',bg:'0891B2'});
  const baseCount=baseHeaders.length;
  const FIXED_TIME_SLOTS=[];for(let mins=330;mins<330+1440;mins+=60){const a=mins%1440;const h=Math.floor(a/60);const m=a%60;const ampm=h>=12?'PM':'AM';const h12=h%12||12;FIXED_TIME_SLOTS.push(`${h12}:${String(m).padStart(2,'0')} ${ampm}`)}
  let lastActive=-1;
  FIXED_TIME_SLOTS.forEach((slot,idx)=>{const has=staffEntries.some(s=>{const cell=slotData[s.staff_id]?.[slot];return!!cell&&(cell.wd>0||cell.wo>0)});if(has)lastActive=idx});
  const slotCount=lastActive>=0?lastActive+1:FIXED_TIME_SLOTS.length;
  const numCols=baseCount+slotCount*2;
  xlBanner(sh,numCols,'TEAM THEVIDU DASHBOARD  |  HOURLY DATA',subtitle);
  const top=XL_HEADER_START,sub=XL_HEADER_START+1;
  baseHeaders.forEach((h,c)=>{const style=xlHeaderStyle(h.bg,XLC.white,12);xlPut(sh,top,c,h.label,style);xlPut(sh,sub,c,'',style);sh.merges.push({s:{r:top,c},e:{r:sub,c}})});
  for(let j=0;j<slotCount;j++){
    const c0=baseCount+j*2;
    const style=xlHeaderStyle(SLOT_HEADER_COLORS[j%SLOT_HEADER_COLORS.length],XLC.white,12);
    xlPut(sh,top,c0,FIXED_TIME_SLOTS[j],style);xlPut(sh,top,c0+1,'',style);
    sh.merges.push({s:{r:top,c:c0},e:{r:top,c:c0+1}});
    xlPut(sh,sub,c0,'WD',xlHeaderStyle(XLC.wdHeadBg,XLC.wdHeadText,10));
    xlPut(sh,sub,c0+1,'W/O',xlHeaderStyle(XLC.woHeadBg,XLC.woHeadText,10));
  }
  sh.heights[top]=28;sh.heights[sub]=20;
  staffEntries.forEach((s,i)=>{
    const r=sub+1+i;
    const fill=i%2===0?XLC.white:XLC.zebra;
    const idle=s.totalWD===0;
    const seValue=s.totalWD-s.dailyTarget;
    const met=!idle&&s.totalWD>=s.dailyTarget;
    const staffSlots=slotData[s.staff_id]||{};
    let c=0;
    xlPut(sh,r,c++,cap(s.staff_id),xlBodyStyle(fill,XLC.cyanText,true));
    xlPut(sh,r,c++,s.name,xlBodyStyle(fill,XLC.text,true));
    xlPut(sh,r,c++,s.primary||'—',xlBodyStyle(fill,XLC.soft));
    xlPut(sh,r,c++,s.tl,xlBodyStyle(fill,XLC.soft));
    if(showAdminCols){
      xlPut(sh,r,c++,s.dailyTarget,xlBodyStyle(fill,XLC.text,true),'0');
      xlPut(sh,r,c++,seValue,xlBodyStyle(fill,seValue<0?XLC.red:XLC.text,true),'0.00');
      xlPut(sh,r,c++,idle?'No Output':met?'Met':'Not Met',xlBodyStyle(met?XLC.greenBg:XLC.redBg,met?XLC.green:XLC.red,true));
    }
    xlPut(sh,r,c++,s.totalWD,xlBodyStyle(fill,idle?XLC.muted:XLC.cyanText,true),'0.00');
    for(let j=0;j<slotCount;j++){
      const cell=staffSlots[FIXED_TIME_SLOTS[j]];
      const wd=cell?.wd||0;
      const wo=cell?.wo||0;
      if(wd>0){const low=wd<35,high=wd>100;xlPut(sh,r,c++,wd,xlBodyStyle(low?XLC.amberBg:high?XLC.redBg:XLC.greenBg,low?XLC.amber:high?XLC.red:XLC.green,true,true),'0.00')}else{xlPut(sh,r,c++,'—',xlBodyStyle(XLC.dashBg,XLC.dash,false,true))}
      if(wo>0){xlPut(sh,r,c++,Math.round(wo),xlBodyStyle(XLC.blueBg,XLC.blue,true),'0')}else{xlPut(sh,r,c++,'—',xlBodyStyle(XLC.dashBg,XLC.dash))}
    }
    sh.heights[r]=21;
  });
  const widths=[12,xlTextWidth(staffEntries.map(s=>s.name),22,36),xlTextWidth(staffEntries.map(s=>s.primary),14,26),xlTextWidth(staffEntries.map(s=>s.tl),16,26)];
  if(showAdminCols)widths.push(11,11,13);
  widths.push(13);
  for(let j=0;j<slotCount;j++)widths.push(10,9);
  return xlFinalize(sh,widths,baseCount,XL_HEADER_START+2);
}

function buildSummarySheet(staffEntries){
  const sh=createXlSheet();
  const thin=xlBorder(XLC.white);
  const hdr=(bg,color,bold,sz)=>({font:xlFont(color,bold!==false,sz||11),fill:xlFill(bg),alignment:XL_CENTER,border:thin});
  const flatTasks=SUMMARY_GROUPS.flatMap(g=>g.tasks.map(t=>({...t,group:g})));
  const keySet=new Set(flatTasks.map(t=>t.key));
  const FIRST_COL=1;
  const totalCol=FIRST_COL+flatTasks.length;
  const R_GROUP=0,R_NAME=1,R_OUT=2,R_DATA=3;
  for(let r=R_GROUP;r<=R_OUT;r++)xlPut(sh,r,0,r===R_GROUP?'UserID':'',hdr('7F7F7F',XLC.white,true,12));
  sh.merges.push({s:{r:R_GROUP,c:0},e:{r:R_OUT,c:0}});
  let c=FIRST_COL;
  SUMMARY_GROUPS.forEach(g=>{
    const start=c;
    g.tasks.forEach((t,i)=>{xlPut(sh,R_GROUP,c,i===0?'TOTAL':'',hdr(g.head,g.text));xlPut(sh,R_NAME,c,t.label,hdr(g.head,g.text));xlPut(sh,R_OUT,c,'Output',hdr(g.head,'ED7D31'));c++});
    if(g.tasks.length>1)sh.merges.push({s:{r:R_GROUP,c:start},e:{r:R_GROUP,c:c-1}});
  });
  xlPut(sh,R_GROUP,totalCol,'TOTAL COUNT',hdr('FF99FF','FF00CC',true,12));
  xlPut(sh,R_NAME,totalCol,'',hdr('FF99FF','FF00CC'));
  sh.merges.push({s:{r:R_GROUP,c:totalCol},e:{r:R_NAME,c:totalCol}});
  xlPut(sh,R_OUT,totalCol,'Output',hdr('FF99FF','FF0066'));
  sh.heights[R_GROUP]=24;sh.heights[R_NAME]=24;sh.heights[R_OUT]=22;
  staffEntries.forEach((s,i)=>{
    const r=R_DATA+i;
    const sums={};
    for(const row of s.firebaseRows){const k=slugify(row.task_name);if(!keySet.has(k))continue;sums[k]=(sums[k]||0)+getRowWDFull(row)}

    xlPut(sh,r,totalCol,Math.round(rowTotal*100)/100,{font:xlFont('FF00CC',true,11),fill:xlFill('FFCCFF'),alignment:XL_CENTER,border:xlBorder(XLC.border)},'#,##0.00;-#,##0.00;"—"');
    sh.heights[r]=21;

  const widths=[12,...flatTasks.map(t=>Math.max(14,t.label.length+4)),16];
  return xlFinalize(sh,widths,SUMMARY_FREEZE_COLS,R_OUT+1);
}

function buildPTDataSheet(rows,p,catLabel,t,dateLabel){
  if(!rows||!rows.length)return null;
  const sh=createXlSheet();
  const cols=[
    {key:'timestamp',kind:'date',label:'DATE'},
    {key:'timestamp',kind:'time',label:'TIME'},
    {key:'category',kind:'data',label:'CATEGORY'},
    {key:'region',kind:'data',label:'REGION'},
    {key:'project_name',kind:'data',label:'PROJECT NAME'},
    {key:'task_name',kind:'data',label:'TASK NAME'},
    {key:'template_name',kind:'data',label:'TEMPLATE NAME'},
    {key:'staff_id',kind:'data',label:'STAFF ID'},
    {key:'value',kind:'data',label:'VALUE'},
    {key:'denominator',kind:'data',label:'DENOMINATOR'},
    {key:'wd',kind:'data',label:'WD'},
    {key:'count',kind:'data',label:'COUNT'}
  ];
  const numCols=cols.length;
  const subtitle=[
    `Project: ${p}`,
    catLabel?`Category: ${catLabel}`:null,
    `Task: ${t}`,
    `Date: ${dateLabel}`,
    `Generated: ${new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})}`
  ].filter(Boolean).join('   |   ');
  xlBanner(sh,numCols,'TEAM THEVIDU DASHBOARD  |  PROJECT DATA',subtitle);
  const TOP=XL_HEADER_START;
  cols.forEach((col,c)=>xlPut(sh,TOP,c,col.label,xlHeaderStyle(FIREBASE_HEADER_COLORS[c%FIREBASE_HEADER_COLORS.length],XLC.white,12)));
  sh.heights[TOP]=30;
  rows.forEach((row,i)=>{
    const r=TOP+1+i;
    const fill=i%2===0?XLC.white:XLC.zebra;
    cols.forEach((col,c)=>{
      const k=col.key;
      const v=row[k];
      if(v===undefined||v===null){xlPut(sh,r,c,'',xlBodyStyle(fill));return}
      if(col.kind==='date'){
        const d=parseTsForExcel(String(v));
        if(!d){xlPut(sh,r,c,String(v),xlBodyStyle(fill,XLC.text,true));return}
        const serial=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/86400000+25569;
        xlPut(sh,r,c,serial,xlBodyStyle(fill,XLC.text,true),'yyyy-mm-dd');
        return;
      }
      if(col.kind==='time'){
        const d=parseTsForExcel(String(v));
        if(!d){xlPut(sh,r,c,'',xlBodyStyle(fill));return}
        const serial=(d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400;
        xlPut(sh,r,c,serial,xlBodyStyle(fill,XLC.text,true),'hh:mm:ss AM/PM');
        return;
      }
      if(typeof v==='number'){
        xlPut(sh,r,c,v,xlBodyStyle(fill,k==='value'||k==='wd'?XLC.blue:XLC.text,k==='value'||k==='wd'),k==='wd'?'0.00':undefined);
        return;
      }
      if(typeof v==='object'){xlPut(sh,r,c,JSON.stringify(v),xlBodyStyle(fill,XLC.soft));return}
      const isId=k==='staff_id'||k==='region';
      xlPut(sh,r,c,String(v),xlBodyStyle(fill,isId?XLC.cyanText:XLC.soft,isId));
    });
    sh.heights[r]=20;
  });
  const widths=cols.map(col=>{
    if(col.kind==='date'||col.kind==='time')return 16;
    let max=col.label.length;
    rows.forEach(r=>{
      const v=r[col.key];
      const len=v===undefined||v===null?0:String(v).length;
      if(len>max)max=len;
    });
    return Math.min(Math.max(14,max+4),40);
  });
  const ws=xlFinalize(sh,widths,0,5);
  ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:TOP,c:0},e:{r:TOP+rows.length,c:numCols-1}})};
  return ws;
}

    <div class="gm-xl">${hours.map(h=>`<span>${slotLabel(h)}</span>`).join('')}</div>
    <div class="gm-leg"><span><i style="background:#3b82f6"></i>EMEA</span><span><i style="background:#ef4444"></i>Other regions</span></div>
    <div style="overflow-x:auto;padding:0 12px 14px"><table><thead><tr><th>Project</th><th>Task</th>${hours.map(h=>`<th style="color:#93c5fd">${slotLabel(h)}</th>`).join('')}<th>Total</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.project)}</td><td style="color:#c4b5fd">${esc(r.task)}</td>${hours.map(h=>{const v=mv(r.hours[h]);return v>0?`<td>${fm(v)}</td>`:'<td class="muted">—</td>'}).join('')}<td style="color:#4ade80;font-weight:700">${fm(hours.reduce((n,h)=>n+mv(r.hours[h]),0))}</td></tr>`).join('')}<tr><td colspan="2"><b>Hourly Total</b></td>${ht.map(t=>`<td style="color:#4ade80;font-weight:700">${fm(t)}</td>`).join('')}<td style="color:#4ade80;font-weight:700">${fm(grand)}</td></tr></tbody></table></div>`:'<div class="empty">No hourly data</div>';
  let m=document.getElementById('gidModal');
  if(!m){m=document.createElement('div');m.id='gidModal';m.className='gm-back';m.onclick=e=>{if(e.target===m)closeGid()};document.body.appendChild(m)}
  m.innerHTML=`<div class="gm-box ${gidBig?'big':''}"><div id="gidCap"><div class="gm-head"><div style="display:flex;align-items:center;gap:12px"><div class="gm-av">${esc(ini||'?')}</div><div><div style="font-weight:700;font-size:18px">${esc(name)}</div><div style="color:#60a5fa;font-size:12px;font-family:monospace">${esc(cap(String(info.id||gid)))}${info.tl?' · TL: '+esc(info.tl):''}${info.primary&&info.primary!=='—'?' · '+esc(info.primary):''}</div></div></div>
    <div class="gm-btns" data-nocap><button id="gmCopy" title="Copy image">🖼 Copy</button><button id="gmDl" title="Download image">⬇ PNG</button><button id="gmXl" title="Export Excel">📊 Excel</button><button id="gmBig" title="Enlarge">${gidBig?'⤡':'⤢'}</button><button id="gmX">✕</button></div></div>
    <div class="gm-body"><div class="gm-kpis">${kpi('Total Without Deno Output',Math.round(tc),'#10b981')}${kpi('Total With Deno',te.toFixed(2),'#f59e0b')}${kpi('EMEA Region Output ('+suf+')',M==='deno'?emE.toFixed(2):Math.round(emC),'#3b82f6')}${kpi('Other Region Output ('+suf+')',M==='deno'?(te-emE).toFixed(2):Math.round(tc-emC),'#ef4444')}</div>
    <div class="gm-card"><div style="overflow-x:auto"><table><thead><tr><th>#</th><th>Project Name</th><th>Task Name</th><th>Region</th><th>Output Count</th><th>Deno Rate</th><th>With Deno</th></tr></thead><tbody>${tbl}</tbody><tfoot><tr><td colspan="4" style="text-align:right"><b>Total:</b></td><td style="color:#4ade80;font-weight:700">${Math.round(tc)}</td><td>-</td><td style="color:#fbbf24;font-weight:700">${te.toFixed(2)}</td></tr></tfoot></table></div></div>
    <div class="gm-card"><h4><span>QAT-wise Hourly Chart <span style="color:#67e8f9">— ${M==='deno'?'With Deno':'Output Count'}</span></span><span data-nocap class="muted small">Metric <select id="gmMetric"><option value="deno" ${M==='deno'?'selected':''}>With Deno</option><option value="count" ${M==='count'?'selected':''}>Output Count</option></select></span></h4>${chart}</div></div></div></div>`;
  $('gmX').onclick=closeGid;
  $('gmBig').onclick=()=>{gidBig=!gidBig;renderGid()};
  $('gmMetric').onchange=e=>{gidMetric=e.target.value;renderGid()};
  $('gmCopy').onclick=()=>gidImage('copy');$('gmDl').onclick=()=>gidImage('download');$('gmXl').onclick=()=>gidExcel(rows,hours,gid,name,info);
}
async function gidImage(mode){
  const el=document.getElementById('gidCap');if(!el||typeof html2canvas==='undefined'){setStatus('Image library not loaded',true);return}
  setStatus('Capturing…');
  try{
    const canvas=await html2canvas(el,{backgroundColor:'#0f172a',scale:2,logging:false,useCORS:true,ignoreElements:n=>n.hasAttribute&&n.hasAttribute('data-nocap'),width:el.scrollWidth,height:el.scrollHeight,windowWidth:el.scrollWidth+60});
    const fn=sanitizeName((gidCur?.info.name||gidCur?.gid||'gid')+'-details')+'.png';
    if(mode==='copy'){const ok=await copyCanvas(canvas,'');if(ok)setStatus('✅ Image copied');else{downloadCanvas(canvas,fn);setStatus('⚠ Copy not supported — downloaded')}}
    else{downloadCanvas(canvas,fn);setStatus('✅ Image downloaded')}
    setTimeout(()=>setStatus('Ready'),2500);
  }catch(e){console.error(e);setStatus('Capture failed: '+e.message,true)}
}
async function gidExcel(rows,hours,gid,name,info){
  if(typeof XLSX==='undefined'||typeof JSZip==='undefined'){alert('Excel library not loaded');return}
  const sub=`GID: ${cap(String(gid))}   |   Primary: ${info.primary||'—'}   |   Team Leader: ${info.tl||'—'}   |   Generated: ${new Date().toLocaleString('en-US',{dateStyle:'medium',timeStyle:'short'})}`;
  const wb=XLSX.utils.book_new();
  /* Summary */
  let sh=createXlSheet();const H=['#','Project Name','Task Name','Region','Output Count','Deno Rate','With Deno'],BG=['64748B','0284C7','7C3AED','D97706','059669','0891B2','EA580C'];
  xlBanner(sh,H.length,`${name.toUpperCase()}  |  ${cap(String(gid))}  |  SUMMARY`,sub);
  H.forEach((h,c)=>xlPut(sh,XL_HEADER_START,c,h,xlHeaderStyle(BG[c],XLC.white,12)));sh.heights[XL_HEADER_START]=28;
  rows.forEach((r,i)=>{const R=XL_HEADER_START+1+i,f=i%2?XLC.zebra:XLC.white,em=isEmea(r.region);
    xlPut(sh,R,0,i+1,xlBodyStyle(f,XLC.muted));xlPut(sh,R,1,r.project,xlBodyStyle(f,XLC.cyanText,true));xlPut(sh,R,2,r.task,xlBodyStyle(f));
    xlPut(sh,R,3,r.region,xlBodyStyle(em?XLC.blueBg:XLC.redBg,em?XLC.blue:XLC.red,true));xlPut(sh,R,4,Math.round(r.count),xlBodyStyle(f,XLC.blue,true),'#,##0');
    xlPut(sh,R,5,r.count>0?r.earned/r.count:0,xlBodyStyle(f,XLC.soft),'0.00');xlPut(sh,R,6,r.earned,xlBodyStyle(f,XLC.amber,true),'0.00');sh.heights[R]=21});
  const TR=XL_HEADER_START+1+rows.length,ts=c=>xlBodyStyle(XLC.zebra,c,true);
  for(let c=0;c<4;c++)xlPut(sh,TR,c,c===3?'TOTAL':'',ts(XLC.text));
  xlPut(sh,TR,4,Math.round(rows.reduce((n,r)=>n+r.count,0)),ts(XLC.green),'#,##0');xlPut(sh,TR,5,'',ts(XLC.muted));xlPut(sh,TR,6,rows.reduce((n,r)=>n+r.earned,0),ts(XLC.amber),'0.00');
  XLSX.utils.book_append_sheet(wb,xlFinalize(sh,[6,28,28,14,16,14,16],0,XL_HEADER_START+1),'Summary');
  /* Hourly (deno + count) */
  sh=createXlSheet();const nc=2+hours.length+1;xlBanner(sh,nc,`${name.toUpperCase()}  |  HOURLY DATA`,sub);
  let R=XL_HEADER_START;
  [['deno','With Deno','D97706','0.00'],['count','Output Count','2563EB','#,##0']].forEach(([m,lab,ac,nf])=>{
    for(let c=0;c<nc;c++)xlPut(sh,R,c,c===0?lab.toUpperCase():'',{font:xlFont(XLC.white,true,13),fill:xlFill(ac),alignment:{horizontal:'left',vertical:'center',indent:1}});
    sh.merges.push({s:{r:R,c:0},e:{r:R,c:nc-1}});R++;
    xlPut(sh,R,0,'Project',xlHeaderStyle('0284C7'));xlPut(sh,R,1,'Task',xlHeaderStyle('7C3AED'));
    hours.forEach((h,j)=>xlPut(sh,R,2+j,slotLabel(h),xlHeaderStyle(SLOT_HEADER_COLORS[j%SLOT_HEADER_COLORS.length])));xlPut(sh,R,2+hours.length,'Total',xlHeaderStyle('059669'));R++;
    const ct=hours.map(()=>0);
    rows.forEach((r,i)=>{const f=i%2?XLC.zebra:XLC.white;xlPut(sh,R,0,r.project,xlBodyStyle(f,XLC.cyanText,true));xlPut(sh,R,1,r.task,xlBodyStyle(f));let rt=0;
      hours.forEach((h,j)=>{const x=r.hours[h],v=x?(m==='deno'?x.earned:x.count):0;rt+=v;ct[j]+=v;if(v>0)xlPut(sh,R,2+j,v,xlBodyStyle(f,XLC.text,true),nf);else xlPut(sh,R,2+j,'—',xlBodyStyle(XLC.dashBg,XLC.dash))});
      xlPut(sh,R,2+hours.length,rt,xlBodyStyle(f,XLC.green,true),nf);R++});
    xlPut(sh,R,0,'Hourly Total',ts(XLC.text));xlPut(sh,R,1,'',ts(XLC.text));ct.forEach((v,j)=>xlPut(sh,R,2+j,v,ts(XLC.green),nf));xlPut(sh,R,2+hours.length,ct.reduce((a,b)=>a+b,0),ts(XLC.amber),nf);R+=3;
  });
  XLSX.utils.book_append_sheet(wb,xlFinalize(sh,[28,28,...hours.map(()=>11),12],2,0),'Hourly Data');
  try{await exportWorkbookWithFreeze(wb,sanitizeName(cap(String(gid))+'-'+name+'-Report')+'.xlsx')}catch(e){console.error(e);alert('Excel export failed: '+e.message)}
}

  openGid(tr.dataset.gid);
